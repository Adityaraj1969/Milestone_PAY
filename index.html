    <script>
      (function () {
        if (window.__agGridTrialFilterInstalled) return;
        window.__agGridTrialFilterInstalled = true;
        var origError = console.error.bind(console);
        var origWarn = console.warn.bind(console);

        function shouldFilter(args) {
          var fullText = '';
          for (var i = 0; i < args.length; i++) {
            fullText += ' ' + String(args[i] || '');
          }
          var lower = fullText.toLowerCase();
          return (
            lower.indexOf('ag grid enterprise license') !== -1 ||
            lower.indexOf('license key not found') !== -1 ||
            lower.indexOf('all ag grid enterprise features are unlocked') !== -1 ||
            lower.indexOf('info@ag-grid.com') !== -1 ||
            lower.indexOf('error #239') !== -1 ||
            (lower.indexOf('ag grid') !== -1 && lower.indexOf('license') !== -1) ||
            /\*{8,}/.test(fullText)
          );
        }

        console.error = function () {
          if (shouldFilter(arguments)) return;
          return origError.apply(console, arguments);
        };
        console.warn = function () {
          if (shouldFilter(arguments)) return;
          return origWarn.apply(console, arguments);
        };
      })();
    </script>
