    <script>
      (function () {
        if (window.__agGridTrialFilterInstalled) return;
        window.__agGridTrialFilterInstalled = true;
        var origError = console.error.bind(console);
        console.error = function () {
          var firstArg = arguments.length > 0 ? String(arguments[0]) : '';
          if (
            firstArg.indexOf('AG Grid Enterprise License') !== -1 ||
            firstArg.indexOf('License Key Not Found') !== -1 ||
            firstArg.indexOf('All AG Grid Enterprise features are unlocked') !== -1 ||
            firstArg.indexOf('info@ag-grid.com') !== -1 ||
            firstArg.indexOf('Error #239') !== -1 ||
            /^\*{10,}/.test(firstArg.trim())
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
